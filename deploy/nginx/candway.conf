limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream candway_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
}

# ============================================================
# LANDING — candway.com / www.candway.com
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name candway.com www.candway.com;

    root /var/www/candway/landing;
    index index.html;

    client_max_body_size 10M;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/candway.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candway.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* /(\.env|\.git|alembic|backend/|node_modules|Procfile|Dockerfile|requirements\.txt) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires 5m;
        add_header Cache-Control "no-cache";
    }
}

# ============================================================
# APPLICATION — app.candway.com
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name app.candway.com;

    root /var/www/candway/app;
    index index.html;

    client_max_body_size 10M;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/candway.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candway.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://candway_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://candway_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://candway_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        alias /var/www/candway/app/assets/;

        expires 1y;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    location ~* /(\.env|\.git|alembic|backend/|node_modules|Procfile|Dockerfile|requirements\.txt) {
        deny all;
        return 404;
    }

    # Admin SPA routes must reach FastAPI so backend
    # authorization runs before the React index is served.
    location ~ ^/admin(?:/|$) {
        proxy_pass http://candway_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires 5m;
        add_header Cache-Control "no-cache";
    }
}

