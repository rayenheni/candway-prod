version: '3.8'

services:
  # ============================================
  # BACKEND (FastAPI + Gunicorn)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # Only build the Python runtime stage
    ports:
      - "127.0.0.1:8000:8000"  # Only accessible via nginx reverse proxy
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://candway_user:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/candway_db?charset=utf8mb4
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: unless-stopped
    volumes:
      - upload_data:/app/backend/uploads
    healthcheck:
      # distroless has no shell, so healthcheck MUST be in JSON exec form
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/monitoring/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - candway_network

  # ============================================
  # REVERSE PROXY + REACT SPA (Nginx)
  # The nginx stage bakes the React SPA into the image at build time.
  # It serves static assets directly and proxies /api + /ws to FastAPI.
  # ============================================
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx             # Only build the nginx stage
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates for HTTPS termination.
      # Create ./certs/ with cert.pem and key.pem before deploying.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - candway_network

  # ============================================
  # DATABASE (MySQL 8.0)
  # ============================================
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: candway_db
      MYSQL_USER: candway_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:3307:3306"  # Only localhost access, not public
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: always
    networks:
      - candway_network

  # ============================================
  # CACHE / TOKEN BLACKLIST (Redis 7)
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - candway_network

  # ============================================
  # MONITORING (Prometheus + Grafana)
  # ============================================
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - candway_network

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    networks:
      - candway_network

networks:
  candway_network:
    driver: bridge
    internal: false  # Only nginx exposed to public

volumes:
  mysql_data:
  redis_data:
  upload_data:
  prometheus_data:
  grafana_data:
