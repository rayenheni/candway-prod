[pytest]
testpaths =
    tests
    backend/tests
python_files = test_*.py
norecursedirs =
    scripts/legacy_root
    .git
    .venv
    venv
    node_modules
    backend/tests
asyncio_default_fixture_loop_scope = function
timeout = 120
timeout_method = thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    security: security-related tests
