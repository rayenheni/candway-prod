limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# SECURITY CONTRACT (backend/client_ip.py):
#   The app resolves the real client IP from the RIGHTMOST entry of
#   X-Forwarded-For, which is the value appended by this nginx via
#   $proxy_add_x_forwarded_for. Client-supplied XFF values are never
#   trusted for rate limiting / login backoff. Do NOT change these to
#   $http_x_forwarded_for or drop the header, or rate-limit bypass is
#   reintroduced.

# Upstream definitions
upstream backend_upstream {
    server backend:8000 max_fails=3 fail_timeout=10s;
}

# ── HTTPS Server Block 1: Candidate Platform (candway.com, www.candway.com) ──
server {
    listen 443 ssl http2;
    server_name candway.com www.candway.com;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;
    proxy_buffering off;
    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ── API endpoints ────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket ────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── React SPA Assets ─────────────────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React SPA — candidate catch-all route ────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        location = /index.html {
            expires 5m;
            add_header Cache-Control "no-cache";
        }
    }

    # ── Uploads ──────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block access to sensitive paths
    location ~* /(\.env|\.git|alembic|backend/|node_modules|Procfile|Dockerfile|requirements\.txt) {
        deny all;
        return 404;
    }
}

