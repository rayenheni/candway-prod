name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff "mypy==2.3.1"

      - name: Lint with Ruff
        run: |
          ruff check backend/ --select E,F,W,I --ignore E501

      - name: Format check with Ruff (changed files)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base revision available; skipping format check"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...HEAD" -- backend/ | grep -E '\.py$' || true)"
          if [ -z "$changed" ]; then
            echo "No changed backend Python files; skipping format check"
          else
            echo "$changed" | xargs ruff format --check
          fi

      - name: Type check with Mypy (regression gate)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set +e
          python -m mypy backend/ --ignore-missing-imports --no-incremental --show-error-codes > mypy_dump.txt 2>&1
          mypy_status=$?
          set -e

          if [ "$mypy_status" -ne 0 ] && [ ! -s mypy_dump.txt ]; then
            echo "::error::Mypy failed without producing an error report (exit $mypy_status); failing closed."
            exit "$mypy_status"
          fi

          python scripts/ci_mypy_gate.py check scripts/mypy_baseline.json mypy_dump.txt --base "$BASE_SHA"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: test_secret_key_for_ci_pipeline
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          DEBUG: "false"
        run: |
          python -m pytest backend/tests/ -v --tb=short --timeout=60

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          bandit -r backend/ -ll -ii

      - name: Check dependencies for known vulnerabilities
        run: |
          safety check -r requirements.txt --ignore 70612
