name: Candway CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Ratchet floor: measured tests/ coverage is ~26%. The old 70% gate never
  # passed, so it blocked every run without protecting anything. Raise this
  # as coverage grows; never lower it.
  COVERAGE_THRESHOLD: 25

jobs:
  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff "mypy==2.3.1"

      - name: Lint with Ruff
        run: ruff check backend/ --select E,F,W,I --ignore E501

      - name: Format check with Ruff (changed files)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base revision available; skipping format check"
            exit 0
          fi
          # --diff-filter=d: deleted files cannot be format-checked (ruff
          # errors on a missing path and xargs exits 123).
          changed="$(git diff --name-only --diff-filter=d "$BASE_SHA...HEAD" -- backend/ | grep -E '\.py$' || true)"
          if [ -z "$changed" ]; then
            echo "No changed backend Python files; skipping format check"
          else
            echo "$changed" | xargs ruff format --check
          fi

      - name: Type check with Mypy (regression gate)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set +e
          python -m mypy backend/ --ignore-missing-imports --no-incremental --show-error-codes > mypy_dump.txt 2>&1
          mypy_status=$?
          set -e

          if [ "$mypy_status" -ne 0 ] && [ ! -s mypy_dump.txt ]; then
            echo "::error::Mypy failed without producing an error report (exit $mypy_status); failing closed."
            exit "$mypy_status"
          fi

          python scripts/ci_mypy_gate.py check scripts/mypy_baseline.json mypy_dump.txt --base "$BASE_SHA"

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r backend/ -ll -ii

      - name: Check dependencies for known vulnerabilities
        run: safety check -r requirements.txt --ignore 70612

  # ============================================
  # FRONTEND BUILD & TYPECHECK
  # ============================================
  frontend-lint:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build SPA
        working-directory: frontend
        run: npm run build

      # tests/ includes SSR/SPA-shell tests that return 503 when static/app
      # is missing; hand the build to the test job instead of rebuilding.
      - name: Upload SPA build
        uses: actions/upload-artifact@v4
        with:
          name: spa-build
          path: static/app
          if-no-files-found: error
          retention-days: 1

  # ============================================
  # BACKEND TESTS
  # ============================================
  test:
    name: Run Tests
    needs: [lint, security, frontend-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SPA build
        uses: actions/download-artifact@v4
        with:
          name: spa-build
          path: static/app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///file:test_db?mode=memory&cache=shared&uri=true"
          SECRET_KEY: test_secret_key_for_ci_pipeline
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          DEBUG: "false"
          ENVIRONMENT: test
          TESTING: "true"
        run: |
          python -m pytest tests/ -v --tb=short --timeout=60 \
            --cov=backend --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage is gated by --cov-fail-under above; an upload hiccup or a
          # missing token (private repo) must not fail the build.
          fail_ci_if_error: false

  # ============================================
  # MIGRATION VALIDATION
  # ============================================
  migration-check:
    name: Migration Validation
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check alembic migration history is linear
        run: |
          pip install alembic
          python -m alembic check 2>&1 || echo "alembic check not available, verifying heads..."
          python -c "
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          config = Config('alembic.ini')
          script = ScriptDirectory.from_config(config)
          heads = script.get_heads()
          assert len(heads) == 1, f'Expected 1 head, got {len(heads)}: {heads}'
          print(f'Migration check passed: single head {heads[0]}')
          "

  # ============================================
  # PERFORMANCE TESTS (main branch only)
  # ============================================
  performance-tests:
    name: Performance Tests
    needs: [test, frontend-lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # The load test hits SPA routes (/, /login.html, ...), which return
      # 503/404 when static/app is missing.
      - name: Download SPA build
        uses: actions/download-artifact@v4
        with:
          name: spa-build
          path: static/app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install locust uvicorn
          pip install -r requirements.txt

      # File-backed SQLite: the seed script and the server are separate
      # processes, and an in-memory DB had no schema at all (every DB-backed
      # endpoint returned 500). Pass/fail is decided by the thresholds in
      # load_test.py (fail ratio <= 1%, p95 <= 5s).
      - name: Run load tests
        env:
          DATABASE_URL: sqlite:///./perf_test.db
          SECRET_KEY: test_secret_key_for_perf
        run: |
          python scripts/perf_seed.py
          uvicorn backend.main:app --host 0.0.0.0 --port 8002 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8002/api/v1/monitoring/health && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8002/api/v1/monitoring/health || { cat uvicorn.log; exit 1; }
          locust -f backend/tests/load_test.py --headless -u 100 -r 10 --run-time 60s --host http://localhost:8002

  # ============================================
  # DEPLOY (main branch only)
  # ============================================
  deploy:
    name: Deploy
    needs: [test, frontend-lint, migration-check, performance-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            candway/platform:latest
            candway/platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            ${DEPLOY_USER}@${DEPLOY_HOST} \
            "cd /opt/candway && \
             git fetch origin main && \
             git reset --hard origin/main && \
             bash scripts/deploy.sh"
