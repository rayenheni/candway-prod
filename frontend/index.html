<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Candway Intelligence Platform - AI-powered recruitment that transforms how you discover, evaluate, and hire exceptional talent." />
    <meta name="theme-color" content="#9333EA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet" />
    <title>Candway - Intelligence Platform</title>
    <style>
      /* Prevent flash of unstyled content */
      html { background-color: #FAF7FF; }
      html.dark { background-color: #0D0A1A; }
    </style>
    <meta name="csp-nonce" content="{{ csp_nonce }}" />
    <script nonce="{{ csp_nonce }}">
      // 1. Apply the correct theme class BEFORE React mounts / first paint
      (function () {
        try {
          var stored = localStorage.getItem('candway-theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
      // 2. Propagate CSP nonce to scripts created dynamically by React 18 hydration
      (function () {
        var meta = document.querySelector('meta[name="csp-nonce"]');
        var cspNonce = (meta && meta.content) || (document.currentScript && document.currentScript.nonce) || '';
        if (!cspNonce) return;
        var origCreate = document.createElement.bind(document);
        document.createElement = function (tag, options) {
          var el = origCreate(tag, options);
          if (tag.toLowerCase() === 'script') el.nonce = cspNonce;
          return el;
        };
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
